spring.application.name=dpcq-game-server
server.port=18080
server.servlet.context-path=/
spring.main.banner-mode=off
spring.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:D:/doudi-resources/resource-mirror/

game.resources.root=D:/doudi-resources/resource-mirror
game.resources.upstream=https://imlj2-cn-res.lansors.com
game.resources.capture-enabled=true
game.resources.allowed-redirect-hosts=imlj2-cn-resbak.lansors.com,imlj2-cn-res.lansors.com
game.resources.connect-timeout-ms=5000
game.resources.read-timeout-ms=30000
game.resources.max-redirects=5

game.netty.port=19090
game.netty.idle-seconds=60
game.netty.boss-threads=1
game.netty.worker-threads=4
game.server.id=1
# 私服开服日。首充 II/III（30/98）配置 SERVER_OPEN_DAY>=2；
# 开服当天只推 6 元，第 9 关再开首充会补 30/98。
game.server-open-time=2026-09-08T00:00:00+08:00
game.guide.server-ip=192.168.1.23
game.database.config-file=D:/doudi-resources/doupo-config/database.db
logging.level.org.gaming.db.mysql.database.DBManager=OFF
