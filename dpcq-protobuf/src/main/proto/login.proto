syntax = "proto3";

package doupo;

option java_package = "com.doupo.protocol";
option java_outer_classname = "LoginProto";
option java_multiple_files = true;

message ClientDeviceInfo {
    string imei = 1;
    string adid = 2;
    string os_version = 3;
    int32 net_type = 4;
    string phone_brand = 5;
    string phone_model = 6;
    string os_type = 7;
    int32 emulator = 8;
}

message LoginAuthReq {
    enum Proto {
        UNKNOWN = 0;
        ID = 50051;
    }

    string account = 1;
    int32 server_id = 2;
    string gid = 3;
    string pid = 4;
    string md5check = 5;
    int32 time = 6;
    string plat_code = 7;
    ClientDeviceInfo client_device_info = 8;
    string rsa_check = 9;
    int32 ras_time = 10;
    string wx_open_id = 11;
    bool wa = 12;
    bool desktop_enter = 13;
    int32 language_type = 14;
    string sdk_type = 15;
    int32 domain_id = 17;
}

message LoginAuthResp {
    int32 result = 1;
    int64 server_time = 2;
    string version = 3;
    int32 reconnect_key = 4;
    bool server_open = 5;
    int64 server_open_time = 6;
    int32 resource_version = 7;
    int32 domain_id = 8;
}
