syntax = "proto3";

package doupo;

option java_package = "com.doupo.protocol";
option java_outer_classname = "ModuleOpenProto";
option java_multiple_files = true;

message ModuleOpenInfoResp {
    repeated int32 opens = 1;
    repeated int32 all_server_define_ids = 2;
    repeated int32 offline_new_open_ids = 3;
}

message ModuleNewOpenResp {
    repeated int32 opens = 1;
}
