    repeated BattleLogEntryVO entry_list = 1;
}

message BattleLogEntryVO {
    int64 time = 1;
    repeated BattleLogItemVO item_list = 2;
}

message BattleLogItemVO {
    int32 packet_id = 1;
    bytes data = 2;
}

message BattleLogUpdateVisibleResp {
