message BattleLogResp {
    int64 battle_log_id = 1;
    int32 type = 2;
    int32 index = 3;
    bytes data = 4;
    FightStatisticsResp fight_statistics_resp = 5;
    int64 start_time = 6;
    PreBattleInfo pre_battle_info = 7;
    bool fin = 8;
    float speed = 9;
}

message FightStatisticsResp {
    int64 battle_log_id = 1;
    repeated StatisticsResp winner = 2;
    repeated StatisticsResp loser = 3;
    bool win = 4;
}

message StatisticsResp {
    int32 essence_fire_id = 1;
    int32 hero_job_id = 2;
    int64 monster_id = 3;
    int32 level = 4;
    int64 damage = 5;
    int64 take_damage = 6;
    int64 cure = 7;
}

message PreBattleInfo {
    int64 create_time = 1;
